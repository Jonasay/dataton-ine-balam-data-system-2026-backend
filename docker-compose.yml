services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balam-data-system-api
    env_file:
      - path: .env
        required: true
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
